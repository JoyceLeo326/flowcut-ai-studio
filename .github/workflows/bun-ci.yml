name: FlowCut CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: flowcut-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test AI product foundations
        run: bun test apps/web/src/ai-edit apps/web/src/ai-studio

      - name: Test public mirror decision engine
        run: bun run test:mirror

      - name: Lint web app
        run: bun run lint:web

      - name: Build web app
        run: bun run build:web

      - name: Build public static compatibility mode
        run: bun run build:public-mirror

      - name: Smoke-test public mirror through HTTP
        run: bun run test:public-mirror

      - name: Block exposed credentials in source and build output
        run: bun run security:secrets

      - name: Block exposed credentials in public mirror
        run: bun run security:mirror
